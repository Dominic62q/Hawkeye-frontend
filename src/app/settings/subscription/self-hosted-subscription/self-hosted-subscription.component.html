<gt-top-app-bar>
  <ng-container slot="left">
    <h1 class="section-header-text" i18n>Subscription</h1>
  </ng-container>
  <ng-container slot="right">
    @if (paidForGlitchTip()) {
      <button
        mat-stroked-button
        class="manage-billing-button"
        (click)="manageBilling()"
        [disabled]="manageBillingLoading()"
      >
        <span
          [style.visibility]="manageBillingLoading() ? 'hidden' : 'visible'"
          i18n
          >Manage Billing</span
        >
        <mat-icon
          [style.visibility]="manageBillingLoading() ? 'hidden' : 'visible'"
          >open_in_new</mat-icon
        >
        @if (manageBillingLoading()) {
          <mat-spinner class="manage-billing-spinner" diameter="18" />
        }
      </button>
    }
  </ng-container>
</gt-top-app-bar>
<section class="l-body">
  <mat-card>
    <mat-card-content>
      <div class="plan-header">
        <span class="body-text-strong" i18n>Self-Hosted</span>
        <mat-divider vertical />
        <span class="body-text" i18n>Usage: Last 30 Days</span>
      </div>
      <mat-divider />
      <gt-subscription-charts
        [totalEventsAllowed]="null"
        [showLimits]="false"
        [currentPeriodLabel]="currentPeriodLabel"
        [previousPeriodLabel]="previousPeriodLabel"
      />
      @if (billingEmail) {
        <p class="body-text" i18n>
          Questions? Contact us at
          <a href="mailto:{{ billingEmail }}">{{ billingEmail }}</a
          >.
        </p>
      }
    </mat-card-content>
  </mat-card>

</section>
